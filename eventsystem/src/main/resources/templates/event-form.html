<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2>Create / Edit Event</h2>

<form th:action="@{/events/save}" th:object="${event}" method="post" enctype="multipart/form-data">

    <input type="hidden" th:field="*{id}" />

    <div class="row">
        <div class="col-md-6 mb-3">
            <label>Event Title</label>
            <input type="text" th:field="*{title}" class="form-control" required />
        </div>

        <div class="col-md-6 mb-3">
            <label>Category</label>
            <select th:field="*{category}" class="form-select" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Concerts">Concerts</option>
                <option value="Sports">Sports</option>
                <option value="Educational">Educational</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label>Venue / Location</label>
            <input type="text" th:field="*{venue}" class="form-control" placeholder="e.g. City Hall" required />
        </div>
        <div class="col-md-6 mb-3">
            <label>Event Time</label>
            <input type="time" th:field="*{startTime}" class="form-control" required />
        </div>
    </div>

    <div class="mb-3">
        <label>Description</label>
        <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
    </div>

    <div class="mb-3">
        <label>Event Poster</label>
        <input type="file" name="image" class="form-control" />
    </div>

    <hr>
    <h5 class="text-secondary">Ticket Pricing (Leave blank if not applicable)</h5>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label>General Admission (Rs.)</label>
            <input type="number" step="0.01" th:field="*{priceGeneral}" class="form-control" placeholder="0.00" />
        </div>
        <div class="col-md-4 mb-3">
            <label class="text-warning">Gold Ticket (Rs.)</label>
            <input type="number" step="0.01" th:field="*{priceGold}" class="form-control" placeholder="Optional" />
        </div>
        <div class="col-md-4 mb-3">
            <label class="text-danger">VIP Ticket (Rs.)</label>
            <input type="number" step="0.01" th:field="*{priceVip}" class="form-control" placeholder="Optional" />
        </div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg mt-3">Save Event</button>
</form>
</body>
</html>
