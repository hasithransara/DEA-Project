<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Event Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <a href="/" class="btn btn-outline-secondary mb-3">&larr; Back to Events</a>

    <div class="card shadow-lg border-0 overflow-hidden">
        <div class="row g-0">

            <div class="col-md-6 bg-secondary d-flex align-items-center justify-content-center">
                <img th:if="${event.imageFileName != null}"
                     th:src="@{'/uploads/' + ${event.imageFileName}}"
                     class="img-fluid w-100" style="object-fit: cover; min-height: 500px;">
                <span th:if="${event.imageFileName == null}" class="text-white">No Image</span>
            </div>

            <div class="col-md-6 p-5">
                <h1 class="display-5 fw-bold mb-2" th:text="${event.title}"></h1>

                <div class="mb-4 text-muted">
                    <p class="mb-1"><i class="bi bi-geo-alt-fill text-danger"></i> <span th:text="${event.venue ?: 'Venue TBD'}"></span></p>
                    <p><i class="bi bi-clock-fill text-primary"></i> <span th:text="${event.startTime ?: 'Time TBD'}"></span></p>
                    <p><i class="bi bi-tag-fill text-warning"></i> <span th:text="${event.category ?: 'General'}"></span></p>
                </div>

                <p class="lead" th:text="${event.description}"></p>

                <hr>
                <h4 class="mb-3">Select Ticket</h4>

                <div th:if="${event.priceGeneral != null}" class="card mb-2 shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div><h5 class="mb-0">General</h5></div>
                        <div class="text-end">
                            <h4 class="mb-0">Rs.<span th:text="${event.priceGeneral}"></span></h4>
                            <a th:href="@{/book/{id}(id=${event.id}, type='General', price=${event.priceGeneral})}" class="btn btn-outline-primary btn-sm">Buy</a>
                        </div>
                    </div>
                </div>

                <div th:if="${event.priceGold != null}" class="card mb-2 border-warning shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div><h5 class="mb-0 text-warning">Gold</h5></div>
                        <div class="text-end">
                            <h4 class="mb-0">Rs.<span th:text="${event.priceGold}"></span></h4>
                            <a th:href="@{/book/{id}(id=${event.id}, type='Gold', price=${event.priceGold})}" class="btn btn-warning text-white btn-sm">Buy</a>
                        </div>
                    </div>
                </div>

                <div th:if="${event.priceVip != null}" class="card mb-2 border-danger shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div><h5 class="mb-0 text-danger">VIP</h5></div>
                        <div class="text-end">
                            <h4 class="mb-0">Rs.<span th:text="${event.priceVip}"></span></h4>
                            <a th:href="@{/book/{id}(id=${event.id}, type='VIP', price=${event.priceVip})}" class="btn btn-danger btn-sm">Buy</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <p class="text-muted">Need help? <a href="#">Contact Support</a></p>
    </div>
</div>

</body>
</html>
