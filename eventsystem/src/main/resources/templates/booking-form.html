<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Secure Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Purchase Ticket</h4>
                </div>
                <div class="card-body p-4">

                    <div class="alert alert-info">
                        <strong>Event:</strong> <span th:text="${event.title}"></span><br>
                        <strong>Ticket Type:</strong> <span th:text="${selectedType}"></span><br>
                        <strong>Price:</strong> Rs.<span th:text="${selectedPrice}"></span>
                    </div>

                    <form th:action="@{/book/process}" method="post">
                        <input type="hidden" name="eventId" th:value="${event.id}">

                        <input type="hidden" name="ticketType" th:value="${selectedType}">
                        <input type="hidden" name="ticketPrice" th:value="${selectedPrice}">

                        <h5 class="mb-3">Your Details</h5>
                        <div class="mb-3">
                            <label>Full Name</label>
                            <input type="text" name="guestName" class="form-control" placeholder="Your name" required>
                        </div>
                        <div class="mb-3">
                            <label>Email Address (For E-Ticket)</label>
                            <input type="email" name="guestEmail" class="form-control" placeholder="mail@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label>Quantity</label>
                            <input type="number" name="quantity" value="1" min="1" max="10" class="form-control" required>
                        </div>

                        <hr>

                        <h5 class="mb-3">Payment Details</h5>
                        <div class="mb-3">
                            <label>Card Number</label>
                            <input type="text" name="cardNumber" class="form-control" placeholder="0000 0000 0000 0000" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label>Expiry</label>
                                <input type="text" class="form-control" placeholder="MM/YY" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label>CVV</label>
                                <input type="text" class="form-control" placeholder="123" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 btn-lg mt-2">Pay & Get Ticket</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="/" class="text-secondary">Cancel and go back</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
