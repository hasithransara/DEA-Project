<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
<div class="card p-4 shadow" style="width: 350px;">
    <h3 class="text-center">Login</h3>

    <div th:if="${param.error}" class="alert alert-danger">Invalid credentials</div>
    <div th:if="${param.logout}" class="alert alert-success">Logged out successfully</div>
    <div th:if="${param.success}" class="alert alert-success">Registration successful! Please login.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
</div>
</body>
</html>
