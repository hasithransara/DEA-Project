<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">EventHub Admin</a>
        <div class="d-flex">
            <span class="navbar-text text-white me-3">Welcome, <span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Events</h2>
        <a href="/events/new" class="btn btn-success"><i class="bi bi-plus-circle"></i> Add New Event</a>
    </div>

    <form th:action="@{/events}" method="get" class="input-group mb-3 w-50">
        <input type="text" name="keyword" class="form-control" placeholder="Search events..." th:value="${keyword}">
        <button class="btn btn-outline-primary" type="submit">Search</button>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-light">
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="event : ${events.content}">
                    <td>
                        <img th:if="${event.imageFileName != null}" th:src="@{'/uploads/' + ${event.imageFileName}}" width="50" class="rounded">
                    </td>
                    <td th:text="${event.title}" class="fw-bold"></td>
                    <td th:text="${#strings.abbreviate(event.description, 50)}"></td>
                    <td>
                        <a th:href="@{/events/edit/{id}(id=${event.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/events/delete/{id}(id=${event.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this event?');"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!events.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/events(page=${events.number - 1}, keyword=${keyword})}">Previous</a>
            </li>
            <li class="page-item" th:classappend="${!events.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/events(page=${events.number + 1}, keyword=${keyword})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
