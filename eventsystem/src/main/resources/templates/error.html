<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Oops! Something went wrong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="text-center">
    <div class="display-1 text-secondary mb-4">
        <i class="bi bi-exclamation-triangle"></i>
    </div>

    <h1 class="display-4 fw-bold">Oops!</h1>
    <p class="lead text-muted mb-4">Something went wrong.</p>

    <div class="card shadow-sm p-4 d-inline-block text-start" style="max-width: 500px;">
        <p><strong>Status Code:</strong> <span th:text="${status} ?: 'Unknown'"></span></p>
        <p><strong>Error:</strong> <span th:text="${error} ?: 'An unexpected error occurred'"></span></p>

        <p th:if="${message}">
            <strong>Details:</strong> <span th:text="${message}"></span>
        </p>
    </div>

    <div class="mt-5">
        <a href="/" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door"></i> Go Back Home
        </a>
    </div>
</div>

</body>
</html>
