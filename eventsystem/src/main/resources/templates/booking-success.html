<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-5 text-center">
    <div class="display-1 text-success mb-3">✔</div>
    <h1 class="mb-3">Booking Confirmed!</h1>
    <p class="lead">You have successfully purchased a ticket for <strong th:text="${ticket.event.title}"></strong>.</p>

    <div class="alert alert-info">
        Ticket ID: #<span th:text="${ticket.id}"></span><br>
        An email confirmation has been sent to your inbox.
    </div>

    <a href="/" class="btn btn-primary mt-3">Back to Events</a>
</div>

</body>
</html>
